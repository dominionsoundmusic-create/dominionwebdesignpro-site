{% set b = site.business %}
<ul class="social{{ ' social--top' if top else '' }}">
  <li><a href="{{ site.social.facebook }}" target="_blank" rel="noopener" aria-label="{{ b.name }} on Facebook (opens in a new tab)">{% include "partials/icons/facebook.svg" %}</a></li>
  <li><a href="{{ site.social.youtube }}" target="_blank" rel="noopener" aria-label="{{ b.name }} on YouTube (opens in a new tab)">{% include "partials/icons/youtube.svg" %}</a></li>
</ul>
